<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your sign-in code</title>
  </head>
  <body style="margin:0;padding:0;background-color:#efe9db;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#efe9db;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;">
            <tr>
              <td align="center" style="padding-bottom:28px;">
                <img
                  src="https://ik.imagekit.io/zx7l7bhei/punyakoti-taila/brand/punyakoti-logo-no-bg.png?tr=w-280,f-auto,q-90"
                  width="200"
                  alt="Punyakoti Taila"
                  style="display:block;border:0;max-width:200px;height:auto;"
                />
              </td>
            </tr>
            <tr>
              <td style="background-color:#fdfaf2;border:1px solid #e7e0cf;border-radius:16px;padding:36px 32px;">
                <h1 style="margin:0 0 12px;font-size:24px;font-weight:700;color:#244023;">Your sign-in code</h1>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#6b665a;">
                  Use this one-time code to sign in to your Punyakoti Taila account:
                </p>
                <p style="margin:0 0 24px;text-align:center;font-size:36px;font-weight:700;letter-spacing:0.2em;color:#244023;">
                  {{ .Token }}
                </p>
                <p style="margin:0 0 20px;font-size:14px;color:#6b665a;text-align:center;">Or use the link below on this device:</p>
                <table role="presentation" cellspacing="0" cellpadding="0" align="center">
                  <tr>
                    <td style="border-radius:12px;background-color:#244023;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:14px;font-weight:600;color:#fdfaf2;text-decoration:none;">Continue to sign in</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:12px;color:#8a8578;text-align:center;">This code expires soon. If you didn’t request it, ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
