<style>
  html, body { margin: 0; padding: 0; background: var(--cream-200); min-height: 100vh; }
  #root { width: 100vw; min-height: 100vh; }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  .pt-stage { width: 100%; min-height: 100vh; }

  /* Floating control cluster */
  .pt-floatcluster {
    position: fixed; top: 16px; right: 16px; z-index: 100;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--green-950);
    color: var(--cream-100);
    padding: 6px;
    border-radius: 999px;
    box-shadow: var(--sh-lg);
    border: 1px solid rgba(245,239,224,0.08);
  }
  .pt-floatbtn {
    background: transparent; border: 0; color: var(--cream-100);
    font-family: var(--font-body); font-size: 12px; font-weight: 500;
    padding: 8px 12px; border-radius: 999px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    transition: background .2s var(--ease-out);
    letter-spacing: -0.005em;
  }
  .pt-floatbtn:hover { background: rgba(245,239,224,0.08); }
  .pt-floatbtn--primary {
    background: rgba(245,239,224,0.06); padding: 8px 14px;
  }
  .pt-floatdivider {
    width: 1px; height: 18px; background: rgba(245,239,224,0.12);
  }
  .pt-devicebtn {
    background: transparent; border: 0;
    font-family: var(--font-body); font-size: 11px; font-weight: 600;
    padding: 6px 12px; border-radius: 999px;
    cursor: pointer; letter-spacing: 0.02em;
    transition: background .2s var(--ease-out), color .2s var(--ease-out);
  }

  /* Page menu */
  .pt-menubackdrop {
    position: fixed; inset: 0; background: rgba(15,26,14,0.4); backdrop-filter: blur(4px);
    z-index: 99; animation: fadein .2s var(--ease-out);
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .pt-pagemenu {
    position: fixed; top: 70px; right: 16px; z-index: 101;
    width: 380px; max-height: 70vh;
    background: var(--cream-100);
    border-radius: var(--r-xl);
    box-shadow: var(--sh-xl);
    overflow: hidden;
    display: flex; flex-direction: column;
    animation: slidein .25s var(--ease-out);
  }
  @keyframes slidein { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .pt-pagemenu-head {
    padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--cream-400);
  }
  .pt-pagemenu-body {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 22px;
  }
  .pt-pagemenu-list { display: flex; flex-direction: column; gap: 2px; }
  .pt-pagemenu-item {
    background: transparent; border: 0;
    display: grid; grid-template-columns: 16px 1fr auto; gap: 12px; align-items: center;
    padding: 9px 10px; border-radius: var(--r-sm);
    text-align: left; cursor: pointer;
    font-family: var(--font-body); font-size: 13px; color: var(--ink-700); font-weight: 500;
    transition: background .15s var(--ease-out), color .15s var(--ease-out);
  }
  .pt-pagemenu-item:hover { background: var(--cream-200); color: var(--green-900); }
  .pt-pagemenu-item.active { background: var(--green-950); color: var(--cream-100); }
  .pt-pagemenu-item.active .pt-pagemenu-dot { background: var(--mustard-400); }
  .pt-pagemenu-dot {
    width: 6px; height: 6px; border-radius: 3px; background: var(--cream-400);
  }
  .pt-pagemenu-device {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--ink-400); width: 16px; text-align: center;
  }
  .pt-pagemenu-item.active .pt-pagemenu-device { color: rgba(245,239,224,0.6); }
  .pt-pagemenu-foot {
    padding: 14px 20px; border-top: 1px solid var(--cream-400);
    font-size: 12px; color: var(--ink-500);
  }
  .pt-pagemenu-foot a { color: var(--green-800); border-bottom: 1px solid var(--green-800); padding-bottom: 1px; }

  /* First-load tip */
  .pt-tip {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--green-950); color: var(--cream-100);
    padding: 12px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 500;
    box-shadow: var(--sh-xl);
    z-index: 100;
    display: inline-flex; align-items: center; gap: 10px;
    animation: tipin .35s var(--ease-out), tipout .35s var(--ease-out) 4.85s forwards;
    border: 1px solid rgba(245,239,224,0.1);
  }
  .pt-tip b { color: var(--mustard-400); font-weight: 600; }
  @keyframes tipin { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes tipout { to { opacity: 0; transform: translate(-50%, 12px); } }
</style>
</head>
